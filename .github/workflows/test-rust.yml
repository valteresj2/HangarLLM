name: HangarLLM Rust

on:
  push:
    paths:
      - "hangarllm-rust/**"
      - "model_prices_and_context_window.json"
      - "hangarllm/rust_bridge/**"
      - "scripts/generate_trace_types.py"
      - "scripts/trace_codegen/**"
      - "scripts/lens_assets/**"
      - "hangarllm/tracing/**"
      - "tests/test_hangarllm_rust/**"
      - "hangarllm/integrations/custom_logger.py"
      - "hangarllm/hangarllm_core_utils/hangarllm_logging.py"
      - "hangarllm/hangarllm_core_utils/logging_worker.py"
      - "hangarllm/proxy/guardrails/**"
      - "hangarllm/utils.py"
      - "hangarllm/ocr/**"
      - "hangarllm/chat_completions/dispatch.py"
      - "hangarllm/embeddings/dispatch.py"
      - "hangarllm/messages/dispatch.py"
      - "hangarllm/responses/dispatch.py"
      - "hangarllm/llms/base_llm/ocr/**"
      - "hangarllm/llms/custom_httpx/llm_http_handler.py"
      - "Makefile"
      - ".cargo/**"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - ".github/actions/setup-uv-with-retries/**"
      - ".github/scripts/smoke_test_native_wheel.py"
      - ".github/scripts/verify_linux_native_wheel.py"
      - "tests/unit/rust_bridge/native_route_wheel_test.py"
      - ".github/workflows/test-rust.yml"
  pull_request:
    branches:
      - main
      - "hangarllm_**"
    paths:
      - "hangarllm-rust/**"
      - "model_prices_and_context_window.json"
      - "hangarllm/rust_bridge/**"
      - "scripts/generate_trace_types.py"
      - "scripts/trace_codegen/**"
      - "scripts/lens_assets/**"
      - "hangarllm/tracing/**"
      - "tests/test_hangarllm_rust/**"
      - "hangarllm/integrations/custom_logger.py"
      - "hangarllm/hangarllm_core_utils/hangarllm_logging.py"
      - "hangarllm/hangarllm_core_utils/logging_worker.py"
      - "hangarllm/proxy/guardrails/**"
      - "hangarllm/utils.py"
      - "hangarllm/ocr/**"
      - "hangarllm/chat_completions/dispatch.py"
      - "hangarllm/embeddings/dispatch.py"
      - "hangarllm/messages/dispatch.py"
      - "hangarllm/responses/dispatch.py"
      - "hangarllm/llms/base_llm/ocr/**"
      - "hangarllm/llms/custom_httpx/llm_http_handler.py"
      - "Makefile"
      - ".cargo/**"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - ".github/actions/setup-uv-with-retries/**"
      - ".github/scripts/smoke_test_native_wheel.py"
      - ".github/scripts/verify_linux_native_wheel.py"
      - "tests/unit/rust_bridge/native_route_wheel_test.py"
      - ".github/workflows/test-rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: hangarllm-ci-v1
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
  CARGO_INCREMENTAL: "0"

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hangarllm-rust
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update

      - run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hangarllm-rust
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a
        with:
          version: "v0.18.0"

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Trim debuginfo to keep the job's target dir within the runner's disk
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: hangarllm-rust
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Install Python dependencies for the bridge tests
        working-directory: .
        run: |
          uv sync --frozen --no-install-project
          echo "PYTHONPATH=$PWD/.venv/lib/$(ls .venv/lib)/site-packages" >> "$GITHUB_ENV"

      - run: rustup toolchain install --no-self-update

      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest@0.9.143

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hangarllm-rust
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a
        with:
          version: "v0.18.0"

      - name: Check generated trace contracts
        working-directory: .
        run: uv run scripts/generate_trace_types.py --check

      - run: cargo nextest run --workspace --locked

      - run: cargo test --workspace --doc --locked

      - name: Test token counter feature combinations
        run: |
          for features in '' fast huggingface tiktoken fast,huggingface fast,tiktoken huggingface,tiktoken fast,huggingface,tiktoken; do
            cargo test -p hangarllm-token-counter --locked --no-default-features --features "$features"
            cargo check -p hangarllm-python-bridge --locked --no-default-features --features "abi3${features:+,$features}"
          done

      - name: Test secret manager feature combinations
        run: |
          cargo test -p hangarllm-auth-gcp --locked --no-default-features
          for features in '' aws google hashicorp azure cyberark aws,google aws,azure google,azure aws,google,azure aws,google,cyberark aws,google,azure,cyberark aws,google,hashicorp,azure,cyberark; do
            cargo test -p hangarllm-secrets --locked --no-default-features --features "$features"
          done

  rust-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hangarllm-rust
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a
        with:
          version: "v0.18.0"

      - run: uv build --wheel --out-dir dist

      - run: python .github/scripts/verify_linux_native_wheel.py dist/*.whl
        env:
          RELEASE_WHEEL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - run: python tests/unit/rust_bridge/native_route_wheel_test.py dist/*.whl

      - name: Run pytest tests/test_hangarllm_rust with the compiled extension
        run: make test-rust-extension

      - run: >-
          uv build --wheel --out-dir panic-dist
          --config-setting "maturin.build-args=--features panic-test,extension-module"

      - run: python .github/scripts/smoke_test_native_wheel.py panic-dist/*.whl
