services:
  - type: web
    name: hangarllm
    runtime: image
    image:
      url: ghcr.io/hangarllm/hangarllm:latest
    envVars:
      - key: PORT
        value: 4000
      - key: HANGARLLM_MASTER_KEY
        generateValue: true
    numInstances: 1
    healthCheckPath: /health/liveliness
    autoDeploy: true
