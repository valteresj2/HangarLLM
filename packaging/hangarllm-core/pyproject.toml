[project]
name = "hangarllm-core"
version = "1.105.0"
description = "Library to easily interface with LLM API providers"
readme = "README.md"
requires-python = ">=3.10, <3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "BerriAI" },
]
dependencies = [
    "fastuuid>=0.14.0,<1.0; python_version < '3.15'",
    "filelock>=3.16.1,<5",
    "httpx[http2]>=0.28.0,<1.0",
    "openai>=2.20.0,<4.0.0",
    "python-dateutil>=2.8.2,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "pyyaml>=6.0.3,<7.0",
    "packaging>=24.0",
    "importlib-metadata>=8.0.0,<9.0",
    "tiktoken>=0.8.0,<1.0; python_version < '3.14'",
    "tiktoken>=0.12.0,<1.0; python_version == '3.14'",
    "tiktoken>=0.14.0,<1.0; python_version >= '3.15'",
    "click>=8.0.0,<9.0",
    "jinja2>=3.1.6,<4.0",
    "aiohttp>=3.14.2,<4.0",
    "anyio>=4.14.0,<5.0",
    "async-timeout>=4.0.3,<6.0; python_version < '3.11'",
    "pydantic>=2.11.0,<3.0.0; python_version < '3.14'",
    "pydantic>=2.12.0,<3.0.0; python_version == '3.14'",
    "pydantic>=2.14.0,<3.0.0; python_version >= '3.15'",
    "pydantic-settings>=2.14.1,<3.0",
    "jsonschema>=4.0.0,<5.0",
    "certifi>=2026.10.19",
    "typing-extensions>=4.13.0,<5.0",
]

[project.urls]
Homepage = "https://github.com/valteresj2/HangarLLM#readme"
Repository = "https://github.com/valteresj2/HangarLLM"
Documentation = "https://github.com/valteresj2/HangarLLM#readme"

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "hangarllm-rust/crates/python-bridge/Cargo.toml"
module-name = "hangarllm.rust_bridge._native"
python-source = "."
bindings = "pyo3"
features = ["extension-module"]
profile = "release"
editable-profile = "dev"
include = [
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = ".cargo/config.toml", format = "sdist" },
    { path = "model_prices_and_context_window.json", format = "sdist" },
    "hangarllm/router_strategy/complexity_router/artifacts/*.json",
    "hangarllm/router_strategy/complexity_router/fuse_presets.json",
    "hangarllm/proxy/model_insights_tasks.json",
    "hangarllm/proxy/common_utils/codex_base_instructions.md",
    "hangarllm/proxy/common_utils/codex_bundled_models_0.166.0.json",
]
exclude = [
    "hangarllm/proxy/_experimental/out",
    "hangarllm/proxy/_experimental/out/**",
    "hangarllm/proxy/enterprise",
    "hangarllm/proxy/enterprise/**",
    "hangarllm/proxy/guardrails/guardrail_hooks/hangarllm_content_filter/guardrail_benchmarks",
    "hangarllm/proxy/guardrails/guardrail_hooks/hangarllm_content_filter/guardrail_benchmarks/**",
    "**/__pycache__",
    "**/__pycache__/**",
    "**/.pytest_cache",
    "**/.pytest_cache/**",
    "**/.ruff_cache",
    "**/.ruff_cache/**",
]
