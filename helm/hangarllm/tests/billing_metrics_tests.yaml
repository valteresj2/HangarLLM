suite: test bearer-only billingMetrics wiring
templates:
  - deployment.yaml
  - configmap-hangarllm.yaml
tests:
  - it: is disabled by default
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_ENDPOINT
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: billing-metrics

  - it: renders required URLs and Cognito secret references when enabled
    template: deployment.yaml
    set:
      billingMetrics:
        enabled: true
        endpoint: https://telemetry.example.com
        tokenUrl: https://auth.example.com/oauth2/token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_ENDPOINT
            value: https://telemetry.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_TOKEN_URL
            value: https://auth.example.com/oauth2/token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: hangarllm-billing-metrics
                key: client-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: hangarllm-billing-metrics
                key: client-secret
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: billing-metrics
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: billing-metrics

  - it: renders the export interval only when set
    template: deployment.yaml
    set:
      billingMetrics:
        enabled: true
        endpoint: https://telemetry.example.com
        tokenUrl: https://auth.example.com/oauth2/token
        exportIntervalMs: 5000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_EXPORT_INTERVAL_MS
            value: "5000"

  - it: requires the endpoint when enabled
    template: deployment.yaml
    set:
      billingMetrics:
        enabled: true
        tokenUrl: https://auth.example.com/oauth2/token
        endpoint: ""
    asserts:
      - failedTemplate:
          errorMessage: billingMetrics.endpoint is required when billingMetrics.enabled is true

  - it: requires the token URL when enabled
    template: deployment.yaml
    set:
      billingMetrics:
        enabled: true
        endpoint: https://telemetry.example.com
        tokenUrl: ""
    asserts:
      - failedTemplate:
          errorMessage: billingMetrics.tokenUrl is required when billingMetrics.enabled is true

  - it: requires the secret name when enabled
    template: deployment.yaml
    set:
      billingMetrics:
        enabled: true
        endpoint: https://telemetry.example.com
        tokenUrl: https://auth.example.com/oauth2/token
        secretName: ""
    asserts:
      - failedTemplate:
          errorMessage: billingMetrics.secretName is required when billingMetrics.enabled is true
