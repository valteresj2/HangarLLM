{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hangarllm.gateway.fullname" . }}
  labels:
    {{- include "hangarllm.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hangarllm.gateway.selectorLabels" . | nindent 4 }}
{{- end }}
