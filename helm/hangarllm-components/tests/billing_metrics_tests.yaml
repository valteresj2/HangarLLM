suite: test bearer-only billingMetrics wiring
templates:
  - gateway/deployment.yaml
  - gateway/configmap.yaml
  - backend/deployment.yaml
  - backend/configmap.yaml
  - migrations-job.yaml
values:
  - ./values/required.yaml
tests:
  - it: is disabled by default
    template: gateway/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_ENDPOINT
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: billing-metrics

  - it: wires gateway URLs and bearer credentials from Secret keys
    template: gateway/deployment.yaml
    set:
      billingMetrics:
        enabled: true
        endpoint: https://telemetry.example.com
        tokenUrl: https://auth.example.com/oauth2/token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_ENDPOINT
            value: https://telemetry.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_TOKEN_URL
            value: https://auth.example.com/oauth2/token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: hangarllm-billing-metrics
                key: client-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: hangarllm-billing-metrics
                key: client-secret
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: billing-metrics
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: billing-metrics

  - it: wires billing metrics on the backend without volumes
    template: backend/deployment.yaml
    set:
      billingMetrics:
        enabled: true
        endpoint: https://telemetry.example.com
        tokenUrl: https://auth.example.com/oauth2/token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: hangarllm-billing-metrics
                key: client-secret
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: billing-metrics

  - it: does not add billing metrics to migrations
    template: migrations-job.yaml
    set:
      billingMetrics:
        enabled: true
        endpoint: https://telemetry.example.com
        tokenUrl: https://auth.example.com/oauth2/token
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_ENDPOINT

  - it: renders an optional export interval
    template: gateway/deployment.yaml
    set:
      billingMetrics:
        enabled: true
        endpoint: https://telemetry.example.com
        tokenUrl: https://auth.example.com/oauth2/token
        exportIntervalMs: 5000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HANGARLLM_BILLING_METRICS_EXPORT_INTERVAL_MS
            value: "5000"

  - it: requires the endpoint when enabled
    template: gateway/deployment.yaml
    set:
      billingMetrics:
        enabled: true
        tokenUrl: https://auth.example.com/oauth2/token
        endpoint: ""
    asserts:
      - failedTemplate:
          errorMessage: billingMetrics.endpoint is required when billingMetrics.enabled is true

  - it: requires the token URL when enabled
    template: gateway/deployment.yaml
    set:
      billingMetrics:
        enabled: true
        endpoint: https://telemetry.example.com
        tokenUrl: ""
    asserts:
      - failedTemplate:
          errorMessage: billingMetrics.tokenUrl is required when billingMetrics.enabled is true

  - it: requires the secret name when enabled
    template: gateway/deployment.yaml
    set:
      billingMetrics:
        enabled: true
        endpoint: https://telemetry.example.com
        tokenUrl: https://auth.example.com/oauth2/token
        secretName: ""
    asserts:
      - failedTemplate:
          errorMessage: billingMetrics.secretName is required when billingMetrics.enabled is true
