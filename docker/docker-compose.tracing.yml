name: hangarllm-tracing

services:
  hangarllm:
    build:
      context: ..
      target: runtime
      args:
        HANGARLLM_RELEASE_TAG: ${HANGARLLM_RELEASE_TAG:-}
    command: ["--config", "/app/tracing-config.yaml", "--port", "4000"]
    environment:
      HANGARLLM_MASTER_KEY: ${HANGARLLM_MASTER_KEY:?set HANGARLLM_MASTER_KEY}
      HANGARLLM_SALT_KEY: sk-local-tracing-salt-key
      DATABASE_URL: postgresql://hangarllm:hangarllm@db:5432/hangarllm
      STORE_MODEL_IN_DB: "True"
      HANGARLLM_LENS_URL: ${HANGARLLM_LENS_URL:?set the Lens URL reachable from the gateway container}
      HANGARLLM_LENS_PUBLIC_URL: ${HANGARLLM_LENS_PUBLIC_URL:?set the Lens URL reachable from your browser and agents}
      HANGARLLM_LENS_SERVICE_TOKEN: ${HANGARLLM_LENS_SERVICE_TOKEN:?set HANGARLLM_LENS_SERVICE_TOKEN}
      LENS_GATEWAY_SECRET: ${LENS_GATEWAY_SECRET:?set the same signing secret on Lens and the gateway}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./tracing-config.yaml:/app/tracing-config.yaml:ro
    ports:
      - "127.0.0.1:4002:4000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hangarllm
      POSTGRES_USER: hangarllm
      POSTGRES_PASSWORD: hangarllm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangarllm -d hangarllm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
