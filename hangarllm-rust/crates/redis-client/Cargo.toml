[package]
name = "hangarllm-redis-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tracing.workspace = true
hangarllm-circuit-breaker.workspace = true
hangarllm-secret-value.workspace = true
hangarllm-python-compat.workspace = true
hangarllm-redis-types.workspace = true
futures-util.workspace = true
redis = { workspace = true, features = [
    "cluster-async",
    "connection-manager",
    "sentinel",
    "tls-rustls-insecure",
    "token-based-authentication",
    "tokio-rustls-comp",
] }
pem = "4.0.0"
pkcs8 = { version = "0.10.2", features = ["3des", "encryption", "std"] }
rustls-native-certs.workspace = true
socket2 = "0.6.5"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
hangarllm-redis-testing.workspace = true
rustls.workspace = true
rstest.workspace = true
