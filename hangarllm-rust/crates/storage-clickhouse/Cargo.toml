[package]
name = "hangarllm-storage-clickhouse"
version = "0.1.0"
description = "Shared ClickHouse connection and HTTP storage for HangarLLM features"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2.workspace = true
hangarllm-error.workspace = true
hangarllm-http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sqlx = { workspace = true, features = ["migrate"] }
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
hangarllm-error.workspace = true
hangarllm-http = { workspace = true, features = ["test-support"] }
rstest.workspace = true
testcontainers-modules = { workspace = true, features = ["clickhouse"] }
tokio.workspace = true
wiremock.workspace = true
