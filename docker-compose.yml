# HangarLLM stack: TLS proxy, gateway and admin UI, Postgres, Redis and Prometheus.
#
#   python scripts/hangar_init_secrets.py   # creates ./secrets, keeps what already exists
#   docker compose up -d --build
#
# Admin UI: https://localhost/ui (user "admin", password in secrets/ui_password)
# Prometheus: http://127.0.0.1:9090, only from this machine
#
# On a public domain set HANGARLLM_DOMAIN and HANGARLLM_TLS (your email) in .env.
services:
  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - "${HANGARLLM_PORT:-443}:443"
    environment:
      HANGARLLM_DOMAIN: ${HANGARLLM_DOMAIN:-localhost}
      HANGARLLM_TLS: ${HANGARLLM_TLS:-internal}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      hangarllm:
        condition: service_healthy
    restart: unless-stopped

  hangarllm:
    build:
      context: .
      target: runtime
      args:
        # ui-prebuilt reuses the committed bundle in hangarllm/proxy/_experimental/out;
        # set HANGARLLM_UI_STAGE=ui-builder to compile the dashboard inside the image.
        UI_STAGE: ${HANGARLLM_UI_STAGE:-ui-prebuilt}
    image: ghcr.io/hangarllm/hangarllm:local
    expose:
      - "4000"
    environment:
      HANGARLLM_MASTER_KEY_FILE: /run/secrets/master_key
      HANGARLLM_SALT_KEY_FILE: /run/secrets/salt_key
      HANGARLLM_UI_SESSION_SECRET_FILE: /run/secrets/ui_session_secret
      HANGARLLM_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      HANGARLLM_LEAK_REPORT_SECRET_FILE: /run/secrets/leak_report_secret
      HANGARLLM_KEY_ROTATION_ENABLED: "true"
      HANGARLLM_KEY_ROTATION_GRACE_PERIOD: "24h"
      UI_PASSWORD_FILE: /run/secrets/ui_password
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORE_MODEL_IN_DB: "True"
      PROXY_BASE_URL: https://${HANGARLLM_DOMAIN:-localhost}:${HANGARLLM_PORT:-443}
    env_file:
      - path: .env
        required: false
    secrets:
      - master_key
      - salt_key
      - ui_session_secret
      - metrics_token
      - leak_report_secret
      - ui_password
      - database_url
      - redis_password
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Enables /metrics. Add your own settings to this file, or point it at another one.
    volumes:
      - ./docker/hangarllm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hangarllm
      POSTGRES_USER: hangarllm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hangarllm -U hangarllm"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    user: redis
    command:
      - sh
      - -c
      - exec redis-server --save '' --appendonly no --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${HANGARLLM_PROMETHEUS_PORT:-9090}:9090"
    secrets:
      - metrics_token
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

secrets:
  master_key:
    file: ./secrets/master_key
  salt_key:
    file: ./secrets/salt_key
  ui_session_secret:
    file: ./secrets/ui_session_secret
  metrics_token:
    file: ./secrets/metrics_token
  leak_report_secret:
    file: ./secrets/leak_report_secret
  ui_password:
    file: ./secrets/ui_password
  database_url:
    file: ./secrets/database_url
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password

volumes:
  prometheus_data:
  caddy_data:
  caddy_config:
  postgres_data:
    name: hangarllm_db
